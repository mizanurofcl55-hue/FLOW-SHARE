name: flowshare
description: Private offline file sharing across your devices.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flowshare_core:
    path: ../../packages/transfer_core
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  file_selector: 1.1.0
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  path: 1.9.1
  sqflite: 2.4.5
  sqflite_common_ffi: 2.4.4
  qr_flutter: 4.1.0
  qr_code_dart_scan: 0.14.0
  desktop_drop: 0.8.4
  open_filex: 5.0.0
  bonsoir: 7.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/brand/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/NotoSansBengali-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
