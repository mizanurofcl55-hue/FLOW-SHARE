name: Verify and build FlowShare
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flowshare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Resolve locked core dependencies
        working-directory: packages/transfer_core
        run: dart pub get --enforce-lockfile
      - name: Analyze and test protocol
        working-directory: packages/transfer_core
        run: |
          dart analyze --fatal-infos
          dart test --reporter expanded
      - name: Resolve locked app dependencies
        working-directory: apps/flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test application
        working-directory: apps/flutter_app
        run: |
          dart format --output=none --set-exit-if-changed lib test ../../packages/transfer_core/lib ../../packages/transfer_core/test
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: golden-test-differences
          path: apps/flutter_app/test/failures
          if-no-files-found: ignore
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            command: flutter build apk --debug --split-per-abi --no-pub
          - platform: windows
            os: windows-2022
            command: flutter build windows --release --no-pub
          - platform: macos
            os: macos-15
            command: flutter build macos --debug --no-pub
          - platform: ios
            os: macos-15
            command: flutter build ios --debug --no-codesign --no-pub
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Build native application
        working-directory: apps/flutter_app
        run: ${{ matrix.command }}
      - name: Check Android QR dependency privacy
        if: matrix.platform == 'android'
        working-directory: apps/flutter_app/android
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > android-runtime-dependencies.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          graph = Path('android-runtime-dependencies.txt').read_text()
          assert 'BUILD SUCCESSFUL' in graph, 'Dependency graph was not resolved'
          for forbidden in ('com.google.mlkit:', 'com.google.android.gms:play-services-mlkit', 'com.google.android.datatransport:'):
              assert forbidden not in graph, f'Unexpected SDK dependency: {forbidden}'
          manifests = list(Path('../build/app/intermediates/merged_manifests').glob('**/AndroidManifest.xml'))
          assert manifests, 'Merged Android manifest not found'
          for path in manifests:
              permissions = {node.get('{http://schemas.android.com/apk/res/android}name') for node in ET.parse(path).findall('uses-permission')}
              for forbidden in ('RECORD_AUDIO', 'WRITE_EXTERNAL_STORAGE', 'MANAGE_EXTERNAL_STORAGE'):
                  assert f'android.permission.{forbidden}' not in permissions, f'Unnecessary permission: {forbidden}'
          print('No ML Kit or Google DataTransport dependencies in the Android runtime graph')
          print('No microphone or broad storage permissions in the merged manifest')
          PY
      - name: Package artifacts and checksums
        shell: python
        run: |
          import hashlib, pathlib, shutil, tarfile
          root=pathlib.Path('apps/flutter_app/build')
          out=pathlib.Path('dist'); out.mkdir(exist_ok=True)
          platform='${{ matrix.platform }}'
          if platform=='android':
              shutil.copy2('apps/flutter_app/android/android-runtime-dependencies.txt', out/'android-runtime-dependencies.txt')
              for path in (root/'app/outputs/flutter-apk').glob('*.apk'):
                  shutil.copy2(path,out/path.name)
          elif platform=='windows':
              shutil.make_archive(str(out/'FlowShare-windows-preview'),'zip',root/'windows/x64/runner/Release')
          else:
              folder=root/('macos/Build/Products/Debug' if platform=='macos' else 'ios/iphoneos')
              with tarfile.open(out/f'FlowShare-{platform}-unsigned-preview.tar.gz','w:gz') as archive:
                  for app in folder.glob('*.app'): archive.add(app,arcname=app.name)
          files=list(out.iterdir())
          if not files: raise RuntimeError('No build artifacts found')
          with (out/'SHA256SUMS.txt').open('w') as sums:
              for path in files:
                  h=hashlib.sha256()
                  with path.open('rb') as f:
                      for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
                  sums.write(f'{h.hexdigest()}  {path.name}\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlowShare-${{ matrix.platform }}-preview
          path: dist/
          if-no-files-found: error
          retention-days: 30

